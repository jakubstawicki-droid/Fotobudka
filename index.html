<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fotobudka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Caveat+Brush&family=Courier+Prime:wght@400;700&family=Shrikhand&display=swap">
<style>
/* Układ: ciemna "kotara" budki, jedna scena na raz: wybór → zdjęcia → szablon */
:root{
  --curtain:#22090e;
  --panel:#341219;
  --panel-2:#45182100;
  --line:#5b2530;
  --ink:#fff1e2;
  --muted:#d7b3a6;
  --bulb:#ffcf6e;
  --red:#e8384d;
  --display:"Shrikhand", Georgia, serif;
  --ui:"Bricolage Grotesque", system-ui, -apple-system, Segoe UI, sans-serif;
  --mono:"Courier Prime", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,.28) 0 14px, rgba(255,255,255,.025) 14px 30px, rgba(0,0,0,.18) 30px 44px),
    var(--curtain);
  color:var(--ink);
  font:16px/1.45 var(--ui);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-top:env(safe-area-inset-top, 0px);
  padding-bottom:env(safe-area-inset-bottom, 0px);
}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 48px}

/* Szyld z żarówkami */
.sign{
  position:relative;display:flex;justify-content:center;align-items:center;
  margin:0 auto 28px;max-width:520px;padding:18px 28px 22px;
  border:3px solid var(--bulb);border-radius:18px;background:var(--panel);
  box-shadow:0 0 0 6px var(--panel),0 0 40px rgba(255,207,110,.18);
}
.sign h1{margin:0;font:400 clamp(40px,9vw,64px)/1 var(--display);color:var(--bulb);
  text-shadow:0 0 18px rgba(255,207,110,.55);letter-spacing:.01em}
.bulbs{position:absolute;inset:-9px;pointer-events:none}
.bulbs i{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--bulb);
  box-shadow:0 0 10px var(--bulb);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.bulbs i{animation:none}}

.scene{display:grid;gap:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
h2{margin:0 0 6px;font-size:22px;font-weight:800;text-wrap:balance}
.lede{margin:0;color:var(--muted)}
.label{display:block;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}

.choices{display:flex;flex-wrap:wrap;gap:10px}
.chip{
  appearance:none;border:2px solid var(--line);background:transparent;color:var(--ink);
  font:600 15px var(--ui);padding:10px 16px;border-radius:999px;cursor:pointer;
  transition:border-color .15s, background .15s;
}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--bulb);background:rgba(255,207,110,.12);color:var(--bulb)}
.chip:disabled{opacity:.35;cursor:not-allowed}
.big-choice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.big-choice .chip{border-radius:14px;padding:18px 10px;display:grid;gap:8px;justify-items:center}
.big-choice .num{font:400 44px/1 var(--display)}
.mini-strip{display:flex;flex-direction:column;gap:3px;padding:4px;background:var(--ink);border-radius:3px}
.mini-strip b{display:block;width:26px;height:18px;background:var(--line)}

.btn{
  appearance:none;border:0;cursor:pointer;border-radius:12px;
  font:800 17px var(--ui);padding:15px 22px;color:#2a0b10;background:var(--bulb);
  box-shadow:0 4px 0 #b9873a;transition:transform .08s, box-shadow .08s;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b9873a}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--muted)}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--bulb);outline-offset:3px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.small{font-size:14px;color:var(--muted)}
.err{color:#ffb1a8;background:rgba(232,56,77,.12);border:1px solid rgba(232,56,77,.45);padding:12px 14px;border-radius:10px}
.linklike{background:none;border:0;padding:0;color:var(--bulb);font:inherit;text-decoration:underline;cursor:pointer}

/* Budka */
.booth{display:grid;gap:16px;justify-items:center}
.viewfinder{
  position:relative;width:100%;max-width:720px;aspect-ratio:4/3;max-height:70vh;
  border-radius:14px;overflow:hidden;background:#000;border:6px solid #111;
  box-shadow:0 0 0 2px var(--line),0 20px 60px rgba(0,0,0,.5);
}
.viewfinder video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
.count{
  position:absolute;inset:0;display:grid;place-items:center;
  font:400 clamp(110px,26vw,220px)/1 var(--display);color:#fff;
  text-shadow:0 6px 30px rgba(0,0,0,.6);pointer-events:none;
}
.count span{animation:pop .9s ease-out}
@keyframes pop{from{transform:scale(1.6);opacity:0}30%{opacity:1}to{transform:scale(1)}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.badge{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.6);padding:6px 12px;border-radius:999px;font:700 14px var(--mono);letter-spacing:.05em}
.thumbs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.thumbs div{width:84px;aspect-ratio:4/3;border-radius:6px;border:2px dashed var(--line);overflow:hidden}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}

/* Edytor */
.editor{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:22px;align-items:start}
@media (max-width:820px){.editor{grid-template-columns:minmax(0,1fr)}}
.stage{display:grid;place-items:center;padding:22px;background:rgba(0,0,0,.25);border-radius:16px;border:1px solid var(--line)}
.stage canvas{max-width:100%;max-height:78vh;height:auto;width:auto;box-shadow:0 18px 50px rgba(0,0,0,.55);border-radius:2px;transform:rotate(-1.2deg)}
.controls{display:grid;gap:20px}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px}
.sw{appearance:none;cursor:pointer;border:2px solid var(--line);border-radius:12px;padding:6px;background:transparent;display:grid;gap:6px;justify-items:center;color:var(--ink);font:600 12px var(--ui)}
.sw[aria-pressed="true"]{border-color:var(--bulb);color:var(--bulb)}
.sw i{display:block;width:100%;height:34px;border-radius:6px}
input[type=text]{width:100%;font:16px var(--ui);color:var(--ink);background:rgba(0,0,0,.25);border:2px solid var(--line);border-radius:10px;padding:11px 12px}
input[type=text]:focus{border-color:var(--bulb);outline:none}
input[type=color]{width:44px;height:36px;border:2px solid var(--line);border-radius:8px;background:none;padding:2px;cursor:pointer}
.toggle{display:flex;gap:10px;align-items:center;cursor:pointer;font-weight:600}
.toggle input{width:20px;height:20px;accent-color:var(--bulb)}
.actions{display:grid;gap:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="sign"><div class="bulbs" id="bulbs"></div><h1>Fotobudka</h1></div>

  <!-- 1. Wybór -->
  <section class="scene" id="s-start">
    <div class="card">
      <h2>Ile zdjęć robimy?</h2>
      <p class="lede">Wybierz liczbę klatek, stań przed kamerą i pozuj. Budka sama odlicza.</p>
      <div style="height:16px"></div>
      <div class="big-choice" id="countPick">
        <button class="chip" data-count="3" aria-pressed="false" id="c3">
          <span class="num">3</span>
          <span class="mini-strip"><b></b><b></b><b></b></span>
          <span>zdjęcia</span>
        </button>
        <button class="chip" data-count="4" aria-pressed="true" id="c4">
          <span class="num">4</span>
          <span class="mini-strip"><b></b><b></b><b></b><b></b></span>
          <span>zdjęcia</span>
        </button>
      </div>
    </div>
    <div class="card">
      <span class="label">Odliczanie przed każdym zdjęciem</span>
      <div class="choices" id="delayPick">
        <button class="chip" data-delay="3" aria-pressed="true" id="d3">3 sekundy</button>
        <button class="chip" data-delay="5" aria-pressed="false" id="d5">5 sekund</button>
        <button class="chip" data-delay="10" aria-pressed="false" id="d10">10 sekund</button>
      </div>
      <div style="height:20px"></div>
      <label class="toggle"><input type="checkbox" id="sound" checked> Dźwięk odliczania</label>
    </div>
    <div class="row">
      <button class="btn" id="enter">Wchodzę do budki</button>
      <span class="small">Bez kamery? <button class="linklike" id="uploadLink">Wgraj gotowe zdjęcia</button></span>
      <input type="file" id="upload" accept="image/*" multiple hidden>
    </div>
    <div class="err" id="camErr" hidden></div>
  </section>

  <!-- 2. Budka -->
  <section class="scene" id="s-booth" hidden>
    <div class="booth">
      <div class="viewfinder">
        <video id="video" playsinline muted autoplay></video>
        <div class="badge" id="badge">ZDJĘCIE 1/4</div>
        <div class="count" id="count"></div>
        <div class="flash" id="flash"></div>
      </div>
      <div class="thumbs" id="thumbs"></div>
      <div class="row">
        <button class="btn" id="go">Start</button>
        <button class="btn ghost" id="cancel">Wróć</button>
      </div>
    </div>
  </section>

  <!-- 3. Edytor -->
  <section class="scene" id="s-edit" hidden>
    <div class="editor">
      <div class="stage"><canvas id="out" width="10" height="10" aria-label="Gotowy pasek zdjęć"></canvas></div>
      <div class="controls">
        <div class="card">
          <span class="label">Szablon</span>
          <div class="swatches" id="tplPick"></div>
          <div class="row" style="margin-top:12px" id="customRow" hidden>
            <input type="color" id="customColor" value="#7fd1c7"><span class="small">Twój kolor tła</span>
          </div>
        </div>
        <div class="card">
          <span class="label">Układ</span>
          <div class="choices" id="layoutPick">
            <button class="chip" data-layout="strip" aria-pressed="true" id="lStrip">Pasek</button>
            <button class="chip" data-layout="grid" aria-pressed="false" id="lGrid">Kwadrat 2×2</button>
          </div>
          <div style="height:18px"></div>
          <span class="label">Filtr</span>
          <div class="choices" id="filterPick">
            <button class="chip" data-filter="none" aria-pressed="true" id="fNone">Bez</button>
            <button class="chip" data-filter="bw" aria-pressed="false" id="fBw">Czarno-białe</button>
            <button class="chip" data-filter="sepia" aria-pressed="false" id="fSepia">Sepia</button>
            <button class="chip" data-filter="vintage" aria-pressed="false" id="fVin">Vintage</button>
            <button class="chip" data-filter="fade" aria-pressed="false" id="fFade">Wyblakłe</button>
          </div>
        </div>
        <div class="card">
          <label class="label" for="caption">Podpis</label>
          <input type="text" id="caption" maxlength="28" placeholder="np. Urodziny Kuby" autocomplete="off">
          <div style="height:12px"></div>
          <div class="choices" id="fontPick">
            <button class="chip" data-font="marker" aria-pressed="true" id="ftMarker">Flamaster</button>
            <button class="chip" data-font="type" aria-pressed="false" id="ftType">Maszyna</button>
            <button class="chip" data-font="retro" aria-pressed="false" id="ftRetro">Retro</button>
          </div>
          <div style="height:14px"></div>
          <label class="toggle"><input type="checkbox" id="showDate" checked> Data na dole</label>
        </div>
        <div class="actions">
          <button class="btn" id="download">Pobierz zdjęcie</button>
          <button class="btn ghost" id="share" hidden>Udostępnij</button>
          <div class="row">
            <button class="btn ghost" id="retake">Zrób jeszcze raz</button>
            <button class="btn ghost" id="restart">Od początku</button>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const PW = 900, PH = 675; // jedna klatka 4:3

  const TEMPLATES = {
    klasyk:  { name:"Klasyk",  bg:"#fbfaf7", fg:"#1b1b1b", sub:"#6b6b6b" },
    film:    { name:"Klisza",  bg:"#141414", fg:"#f4efe6", sub:"#a39b8e", film:true },
    roz:     { name:"Róż",     bg:"#f7c9d4", fg:"#8a1736", sub:"#b4465f", border:"#8a1736" },
    retro:   { name:"Retro",   bg:"#e8b13c", fg:"#3b2410", sub:"#6b4620", dots:"#3b2410" },
    noc:     { name:"Noc",     bg:"#1d1640", fg:"#ffd86b", sub:"#b9aef0", stars:true },
    wlasny:  { name:"Własny",  bg:"#7fd1c7", fg:"#10302c", sub:"#2f5a54", custom:true }
  };
  const FONTS = {
    marker: '"Caveat Brush", "Comic Sans MS", cursive',
    type:   '"Courier Prime", "Courier New", monospace',
    retro:  '"Shrikhand", Georgia, serif'
  };

  const state = {
    count:4, delay:3, sound:true,
    raw:[], filtered:{}, // raw: canvasy z kamerą; filtered[filter] = [canvas]
    tpl:"klasyk", layout:"strip", filter:"none",
    caption:"", font:"marker", showDate:true
  };
  let stream = null, running = false, audio = null;

  /* żarówki wokół szyldu */
  (function bulbs(){
    const b = $("bulbs"); const n = 9;
    for (let i=0;i<n;i++){
      for (const side of ["top","bottom"]){
        const el = document.createElement("i");
        el.style.left = `calc(${(i+.5)/n*100}% - 5px)`;
        el.style[side] = "0";
        el.style.animationDelay = ((i + (side==="top"?0:1)) % 2) * .8 + "s";
        b.appendChild(el);
      }
    }
  })();

  function show(id){
    for (const s of ["s-start","s-booth","s-edit"]) $(s).hidden = s !== id;
    window.scrollTo({top:0, behavior:"smooth"});
  }
  function pick(groupId, attr, val){
    $(groupId).querySelectorAll(`[data-${attr}]`).forEach(b =>
      b.setAttribute("aria-pressed", String(b.dataset[attr] === String(val))));
  }
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  /* --- wybór --- */
  $("countPick").addEventListener("click", e => {
    const b = e.target.closest("[data-count]"); if (!b) return;
    state.count = +b.dataset.count; pick("countPick","count",state.count);
  });
  $("delayPick").addEventListener("click", e => {
    const b = e.target.closest("[data-delay]"); if (!b) return;
    state.delay = +b.dataset.delay; pick("delayPick","delay",state.delay);
  });
  $("sound").addEventListener("change", e => state.sound = e.target.checked);

  function camError(msg){
    const el = $("camErr"); el.hidden = false; el.textContent = msg;
  }

  $("enter").addEventListener("click", async () => {
    $("camErr").hidden = true;
    if (!navigator.mediaDevices?.getUserMedia){
      camError("Ta przeglądarka nie daje dostępu do kamery. Strona musi działać przez https (albo localhost). Możesz też wgrać gotowe zdjęcia.");
      return;
    }
    try{
      stream = await navigator.mediaDevices.getUserMedia({
        video:{ facingMode:"user", width:{ideal:1280}, height:{ideal:960} }, audio:false
      });
    }catch(err){
      camError(err && err.name === "NotAllowedError"
        ? "Kamera jest zablokowana. Zezwól na dostęp do kamery w ustawieniach przeglądarki i spróbuj ponownie."
        : "Nie udało się włączyć kamery. Sprawdź, czy nie używa jej inna aplikacja, albo wgraj gotowe zdjęcia.");
      return;
    }
    try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
    $("video").srcObject = stream;
    state.raw = [];
    buildThumbs();
    $("badge").textContent = `ZDJĘCIE 1/${state.count}`;
    $("go").disabled = false;
    show("s-booth");
  });

  function stopCam(){
    if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  }
  $("cancel").addEventListener("click", () => { running = false; stopCam(); show("s-start"); });

  function buildThumbs(){
    const t = $("thumbs"); t.innerHTML = "";
    for (let i=0;i<state.count;i++){
      const d = document.createElement("div");
      if (state.raw[i]){ const img = new Image(); img.src = state.raw[i].toDataURL("image/jpeg",.6); img.alt=""; d.appendChild(img); }
      t.appendChild(d);
    }
  }

  function beep(freq, dur){
    if (!state.sound || !audio) return;
    try{
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = freq; o.type = "sine";
      g.gain.setValueAtTime(.18, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, audio.currentTime + dur);
      o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + dur);
    }catch(e){}
  }

  async function countdown(n){
    const c = $("count");
    for (let i=n;i>0;i--){
      if (!running) return;
      c.innerHTML = `<span>${i}</span>`;
      beep(660, .12);
      await sleep(1000);
    }
    c.innerHTML = "";
  }

  function capture(){
    const v = $("video");
    const vw = v.videoWidth, vh = v.videoHeight;
    const target = 4/3;
    let sw = vw, sh = vh, sx = 0, sy = 0;
    if (vw/vh > target){ sw = vh*target; sx = (vw-sw)/2; } else { sh = vw/target; sy = (vh-sh)/2; }
    const cv = document.createElement("canvas"); cv.width = PW; cv.height = PH;
    const ctx = cv.getContext("2d");
    ctx.translate(PW,0); ctx.scale(-1,1); // lustro, tak jak w podglądzie
    ctx.drawImage(v, sx, sy, sw, sh, 0, 0, PW, PH);
    return cv;
  }

  $("go").addEventListener("click", async () => {
    if (running) return;
    if (audio && audio.state === "suspended") audio.resume();
    running = true; $("go").disabled = true;
    state.raw = []; buildThumbs();
    for (let i=0;i<state.count;i++){
      $("badge").textContent = `ZDJĘCIE ${i+1}/${state.count}`;
      await countdown(state.delay);
      if (!running) return;
      state.raw.push(capture());
      beep(1200, .08);
      const f = $("flash"); f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
      buildThumbs();
      await sleep(900);
    }
    running = false;
    stopCam();
    openEditor();
  });

  /* --- wgrywanie zamiast kamery --- */
  $("uploadLink").addEventListener("click", () => $("upload").click());
  $("upload").addEventListener("change", async e => {
    const files = [...e.target.files].slice(0, state.count);
    e.target.value = "";
    if (!files.length) return;
    if (files.length < state.count){
      camError(`Wybrano ${files.length} zdjęć, a potrzeba ${state.count}. Zaznacz ${state.count} pliki naraz.`);
      return;
    }
    $("camErr").hidden = true;
    state.raw = await Promise.all(files.map(fileToFrame));
    openEditor();
  });
  function fileToFrame(file){
    return new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => {
        const target = 4/3, iw = img.naturalWidth, ih = img.naturalHeight;
        let sw = iw, sh = ih, sx = 0, sy = 0;
        if (iw/ih > target){ sw = ih*target; sx = (iw-sw)/2; } else { sh = iw/target; sy = (ih-sh)/2; }
        const cv = document.createElement("canvas"); cv.width = PW; cv.height = PH;
        cv.getContext("2d").drawImage(img, sx, sy, sw, sh, 0, 0, PW, PH);
        URL.revokeObjectURL(img.src); res(cv);
      };
      img.onerror = rej;
      img.src = URL.createObjectURL(file);
    });
  }

  /* --- filtry (ręcznie na pikselach, działa też w Safari) --- */
  function filterFrame(src, kind){
    if (kind === "none") return src;
    const cv = document.createElement("canvas"); cv.width = src.width; cv.height = src.height;
    const ctx = cv.getContext("2d"); ctx.drawImage(src,0,0);
    const img = ctx.getImageData(0,0,cv.width,cv.height), d = img.data;
    for (let i=0;i<d.length;i+=4){
      let r=d[i], g=d[i+1], b=d[i+2];
      const l = .299*r + .587*g + .114*b;
      if (kind === "bw"){
        const c = Math.min(255, Math.max(0, (l-128)*1.15+128)); r=g=b=c;
      } else if (kind === "sepia"){
        const R=r, G=g, B=b;
        r = Math.min(255, .393*R+.769*G+.189*B);
        g = Math.min(255, .349*R+.686*G+.168*B);
        b = Math.min(255, .272*R+.534*G+.131*B);
      } else if (kind === "vintage"){
        r = Math.min(255, (r-128)*1.1+128 + 18);
        g = Math.min(255, (g-128)*1.05+128 + 6);
        b = Math.max(0, (b-128)*.9+128 - 14);
        r = r*.85 + l*.15; g = g*.85 + l*.15; b = b*.85 + l*.15;
      } else if (kind === "fade"){
        r = 40 + r*.78; g = 40 + g*.78; b = 46 + b*.76;
      }
      d[i]=r; d[i+1]=g; d[i+2]=b;
    }
    ctx.putImageData(img,0,0);
    if (kind === "vintage" || kind === "bw"){ // winieta
      const grd = ctx.createRadialGradient(cv.width/2,cv.height/2,cv.height*.35,cv.width/2,cv.height/2,cv.width*.7);
      grd.addColorStop(0,"rgba(0,0,0,0)"); grd.addColorStop(1,"rgba(0,0,0,.35)");
      ctx.fillStyle = grd; ctx.fillRect(0,0,cv.width,cv.height);
    }
    return cv;
  }
  function frames(){
    if (!state.filtered[state.filter]) state.filtered[state.filter] = state.raw.map(f => filterFrame(f, state.filter));
    return state.filtered[state.filter];
  }

  /* --- edytor --- */
  function buildTplPicker(){
    const box = $("tplPick"); box.innerHTML = "";
    for (const [key, t] of Object.entries(TEMPLATES)){
      const b = document.createElement("button");
      b.className = "sw"; b.dataset.tpl = key; b.id = "tpl-" + key;
      b.setAttribute("aria-pressed", String(key === state.tpl));
      const bg = t.custom ? $("customColor").value : t.bg;
      b.innerHTML = `<i style="background:${bg};box-shadow:inset 0 0 0 3px ${t.fg}33"></i>${t.name}`;
      box.appendChild(b);
    }
  }
  $("tplPick").addEventListener("click", e => {
    const b = e.target.closest("[data-tpl]"); if (!b) return;
    state.tpl = b.dataset.tpl;
    $("tplPick").querySelectorAll("[data-tpl]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    $("customRow").hidden = !TEMPLATES[state.tpl].custom;
    render();
  });
  $("customColor").addEventListener("input", e => {
    const c = e.target.value;
    TEMPLATES.wlasny.bg = c;
    // czytelny tekst: jasne tło → ciemny tekst
    const n = parseInt(c.slice(1),16), r=n>>16, g=(n>>8)&255, b=n&255;
    const light = (.299*r+.587*g+.114*b) > 150;
    TEMPLATES.wlasny.fg = light ? "#151515" : "#fbfaf7";
    TEMPLATES.wlasny.sub = light ? "#4a4a4a" : "#d8d8d8";
    $("tpl-wlasny").querySelector("i").style.background = c;
    render();
  });
  $("layoutPick").addEventListener("click", e => {
    const b = e.target.closest("[data-layout]"); if (!b || b.disabled) return;
    state.layout = b.dataset.layout; pick("layoutPick","layout",state.layout); render();
  });
  $("filterPick").addEventListener("click", e => {
    const b = e.target.closest("[data-filter]"); if (!b) return;
    state.filter = b.dataset.filter; pick("filterPick","filter",state.filter); render();
  });
  $("fontPick").addEventListener("click", e => {
    const b = e.target.closest("[data-font]"); if (!b) return;
    state.font = b.dataset.font; pick("fontPick","font",state.font); render();
  });
  $("caption").addEventListener("input", e => { state.caption = e.target.value; render(); });
  $("showDate").addEventListener("change", e => { state.showDate = e.target.checked; render(); });

  function openEditor(){
    state.filtered = {};
    const n = state.raw.length;
    $("lGrid").disabled = n !== 4;
    if (n !== 4 && state.layout === "grid"){ state.layout = "strip"; pick("layoutPick","layout","strip"); }
    buildTplPicker();
    $("customRow").hidden = !TEMPLATES[state.tpl].custom;
    $("share").hidden = !(navigator.canShare && navigator.share);
    show("s-edit");
    render();
    // gdy fonty się dociągną, przerysuj podpis
    if (document.fonts) Promise.all(Object.values(FONTS).map(f => document.fonts.load(`80px ${f}`))).then(render).catch(()=>{});
  }

  function dateStr(){
    const d = new Date(), p = x => String(x).padStart(2,"0");
    return `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()}`;
  }

  function render(){
    const fr = frames(); if (!fr.length) return;
    const t = TEMPLATES[state.tpl], n = fr.length;
    const grid = state.layout === "grid" && n === 4;
    const gap = 30;
    const side = t.film ? 120 : 60;
    const top = t.film ? 70 : 60;
    const hasText = state.caption.trim() || state.showDate;
    const footer = hasText ? (state.caption.trim() && state.showDate ? 250 : 190) : 70;

    const cols = grid ? 2 : 1, rows = grid ? 2 : n;
    const W = side*2 + cols*PW + (cols-1)*gap;
    const H = top + rows*PH + (rows-1)*gap + footer;

    const cv = $("out"); cv.width = W; cv.height = H;
    const ctx = cv.getContext("2d");
    ctx.fillStyle = t.bg; ctx.fillRect(0,0,W,H);

    // ozdobniki szablonu
    if (t.film){
      ctx.fillStyle = "#f4efe6";
      const hole = 34, hh = 46, step = 90;
      for (let y=30; y<H-30; y+=step){
        roundRect(ctx, (side-hole)/2, y, hole, hh, 7); ctx.fill();
        roundRect(ctx, W-side+(side-hole)/2, y, hole, hh, 7); ctx.fill();
      }
    }
    if (t.border){
      ctx.strokeStyle = t.border; ctx.lineWidth = 6;
      ctx.strokeRect(22,22,W-44,H-44);
      ctx.lineWidth = 2; ctx.strokeRect(34,34,W-68,H-68);
    }
    if (t.dots){
      ctx.fillStyle = t.dots;
      for (let x=30; x<W-20; x+=36){ dot(ctx,x,26,6); dot(ctx,x,H-26,6); }
      for (let y=62; y<H-50; y+=36){ dot(ctx,26,y,6); dot(ctx,W-26,y,6); }
    }
    if (t.stars){
      let seed = 7; const rnd = () => (seed = (seed*9301+49297)%233280)/233280;
      ctx.fillStyle = "#ffffff";
      for (let i=0;i<70;i++){
        const x = rnd()*W, y = rnd()*H, r = rnd()*2.4+.6;
        ctx.globalAlpha = .35 + rnd()*.6; dot(ctx,x,y,r);
      }
      ctx.globalAlpha = 1;
    }

    // zdjęcia
    fr.forEach((f,i) => {
      const c = grid ? i%2 : 0, r = grid ? Math.floor(i/2) : i;
      const x = side + c*(PW+gap), y = top + r*(PH+gap);
      ctx.drawImage(f, x, y, PW, PH);
      if (!t.film){ ctx.strokeStyle = "rgba(0,0,0,.12)"; ctx.lineWidth = 2; ctx.strokeRect(x+1,y+1,PW-2,PH-2); }
    });

    // podpis i data
    const baseY = top + rows*PH + (rows-1)*gap;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const cap = state.caption.trim();
    if (cap){
      let size = state.font === "type" ? 78 : 96;
      ctx.font = `${state.font==="type"?"700 ":""}${size}px ${FONTS[state.font]}`;
      while (ctx.measureText(cap).width > W - side*2 - 20 && size > 30){
        size -= 4; ctx.font = `${state.font==="type"?"700 ":""}${size}px ${FONTS[state.font]}`;
      }
      ctx.fillStyle = t.fg;
      ctx.fillText(cap, W/2, baseY + (state.showDate ? 100 : footer/2));
    }
    if (state.showDate){
      ctx.font = `700 40px ${FONTS.type}`;
      ctx.fillStyle = cap ? t.sub : t.fg;
      ctx.fillText(dateStr(), W/2, baseY + (cap ? 190 : footer/2));
    }
  }
  function roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  function dot(ctx,x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }

  function fileName(){
    const d = new Date(), p = x => String(x).padStart(2,"0");
    return `fotobudka-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.png`;
  }
  function getBlob(){ return new Promise(r => $("out").toBlob(r, "image/png")); }

  $("download").addEventListener("click", async () => {
    const blob = await getBlob(); if (!blob) return;
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = fileName();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  });
  $("share").addEventListener("click", async () => {
    const blob = await getBlob(); if (!blob) return;
    const file = new File([blob], fileName(), {type:"image/png"});
    if (navigator.canShare && navigator.canShare({files:[file]})){
      try { await navigator.share({files:[file], title:"Fotobudka"}); } catch(e){}
    } else {
      $("download").click();
    }
  });

  $("retake").addEventListener("click", () => $("enter").click());
  $("restart").addEventListener("click", () => { state.raw = []; state.filtered = {}; show("s-start"); });
})();
</script>
</body>
</html>
